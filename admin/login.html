<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login | Northstar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/admin/assets/admin.css"></head><body class="login-body"><main class="login-card"><a class="admin-logo" href="/"><span>✳</span> NORTHSTAR</a><p class="eyebrow">PRIVATE ACCESS / ADMIN PORTAL</p><h1>Welcome back.</h1><p class="login-lead">Sign in to manage your store, products, orders, and customers.</p><form id="login-form"><label>Email or username<input id="email" type="email" autocomplete="username" required placeholder="admin@northstar.local"></label><label>Password<div class="password-field"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="toggle-password" aria-label="Show password">Show</button></div></label><div class="login-options"><label class="check"><input type="checkbox" id="remember"> Remember this device</label><button type="button" class="link-button" id="forgot">Forgot password?</button></div><button class="solid-button login-submit" type="submit">Sign in <span>↗</span></button><p class="form-error" id="login-error" role="alert"></p></form><p class="login-foot">Protected admin area <span>•</span> Session expires after inactivity</p></main><script src="/admin/assets/login.js"></script></body></html>
